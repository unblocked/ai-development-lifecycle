[project]
name = "adlc"
version = "0.1.0"
description = "Measure how fast one repository ships and compare it with industry benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Unblocked" }]
keywords = ["developer-productivity", "ai", "metrics", "engineering-metrics", "dora"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
]
dependencies = [
    "rich>=15.0.0",
]

[project.urls]
Homepage = "https://github.com/unblocked/ai-development-lifecycle"

[project.scripts]
adlc = "adlc.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adlc = ["sample/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "FURB", "PLW", "DTZ"]
ignore = ["DTZ011"]
